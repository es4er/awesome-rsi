    <style>
      *,

        margin: 0;

      .page {
        display: block;

        top: 0.75rem;
        left: 0.75rem;
        z-index: 10;
        padding: 0.6rem 0.85rem;
        border-radius: 0.4rem;
        color: #fff;
        background: #1f64a5;
        text-decoration: none;
        transform: translateY(-150%);
        transition: transform 120ms ease;
      }

      .skip-link:focus {
        transform: translateY(0);
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 600px) {

      @media print {

        body,
